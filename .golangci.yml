version: "2"

linters:
  enable:
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
  disable:
    - errcheck
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        - unnamedResult
        - exitAfterDefer
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: true
        - name: var-naming
          disabled: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
